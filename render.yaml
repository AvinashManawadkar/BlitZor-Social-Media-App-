services:
  # Spring Boot Java Backend Web Service (100% FREE Tier)
  - type: web
    name: pulsesocial-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: "update"
      - key: FILE_UPLOAD_DIR
        value: "uploads"
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: pulsesocial-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: pulsesocial-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: pulsesocial-db
          property: password
      - key: SPRING_DATASOURCE_DRIVER_CLASS_NAME
        value: "org.postgresql.Driver"

  # React + Vite Frontend Static Site (100% FREE by default on Render)
  - type: web
    name: pulsesocial-frontend
    runtime: static
    buildCommand: "cd PulseSocial-Frontend && npm install && npm run build"
    staticPublishPath: "./PulseSocial-Frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        value: "https://pulsesocial-backend.onrender.com/api"
      - key: VITE_BACKEND_URL
        value: "https://pulsesocial-backend.onrender.com"

databases:
  - name: pulsesocial-db
    plan: free
    databaseName: pulse_social
    user: pulsesocial_user
