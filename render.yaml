services:
  # Spring Boot Java Backend Web Service (Docker)
  - type: web
    name: pulsesocial-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: "update"
      - key: FILE_UPLOAD_DIR
        value: "uploads"

  # React + Vite Frontend Static Site
  - type: web
    name: pulsesocial-frontend
    runtime: static
    buildCommand: "cd PulseSocial-Frontend && npm install && npm run build"
    staticPublishPath: "./PulseSocial-Frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        value: "https://pulsesocial-backend.onrender.com/api"
      - key: VITE_BACKEND_URL
        value: "https://pulsesocial-backend.onrender.com"
