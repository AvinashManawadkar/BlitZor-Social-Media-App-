services:
  # Spring Boot Java Backend Web Service
  - type: web
    name: pulsesocial-backend
    env: java
    buildCommand: "./mvnw clean package -DskipTests"
    startCommand: "java -jar target/backend-0.0.1-SNAPSHOT.jar"
    envVars:
      - key: JAVA_VERSION
        value: "17"
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: "update"
      - key: FILE_UPLOAD_DIR
        value: "uploads"

  # React + Vite Frontend Static Site
  - type: web
    name: pulsesocial-frontend
    env: static
    buildCommand: "cd PulseSocial-Frontend && npm install && npm run build"
    staticPublishPath: "./PulseSocial-Frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        value: "https://pulsesocial-backend.onrender.com/api"
      - key: VITE_BACKEND_URL
        value: "https://pulsesocial-backend.onrender.com"
